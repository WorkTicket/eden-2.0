  - "~..T......F......T.~"
  - "~..................~"
  - "~....T.........F...~"
  - "~..................~"
  - "~.......~~~........~"
  - "~......~~~~~.......~"
  - "~.......~~~........~"
  - "~..F.........T.....~"
  - "~~~~~~~~~~~~~~~~~~~~"
